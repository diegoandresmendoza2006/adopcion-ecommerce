<div class="solicitud-container">
  <div class="solicitud-card">
    <h2>Formulario de Adopción</h2>
    <p>Estás a un paso de darle un hogar a una mascota</p>

    @if (mascota(); as m) {
      <p><strong>Mascota seleccionada: {{ m.nombre }}</strong> ({{ m.especie }})</p>
    }
    @if (error()) { <p class="msg-error">{{ error() }}</p> }
    @if (ok()) { <p class="msg-ok">{{ ok() }}</p> }

    <form (ngSubmit)="enviarSolicitud()">
      <div class="form-group">
        <label for="nombreCompleto">Nombre Completo:</label>
        <input type="text" id="nombreCompleto" name="nombre_contacto" [(ngModel)]="datos.nombre_contacto"
               placeholder="Tu nombre y apellido" maxlength="150" required>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono de Contacto:</label>
        <input type="tel" id="telefono" name="telefono" [(ngModel)]="datos.telefono"
               placeholder="3001234567" maxlength="30" required>
      </div>

      <div class="form-group">
        <label for="vivienda">Tipo de Vivienda:</label>
        <select id="vivienda" name="tipo_vivienda" [(ngModel)]="datos.tipo_vivienda">
          <option value="Casa propia">Casa propia</option>
          <option value="Casa alquilada">Casa alquilada</option>
          <option value="Apartamento">Apartamento</option>
        </select>
      </div>

      <div class="form-group">
        <label for="motivo">¿Por qué deseas adoptar?</label>
        <textarea id="motivo" name="motivo" rows="3" [(ngModel)]="datos.motivo" maxlength="1000"
                  placeholder="Cuéntanos un poco sobre tu motivación..." required></textarea>
      </div>

      <button type="submit" class="btn-enviar" [disabled]="!mascota() || enviando()">{{ enviando() ? 'Enviando...' : 'Enviar Solicitud' }}</button>
    </form>

    <div class="link-volver">
      <a routerLink="/catalogo">← Volver al catálogo</a>
    </div>
  </div>
</div>
