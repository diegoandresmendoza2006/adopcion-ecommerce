<div class="login-container">
  <div class="login-card">
    <div class="logo"><ng-icon name="lucidePawPrint" size="46" /></div>
    <h2>Paws&Shop</h2>
    <p class="subtitulo">Inicia sesión para adoptar y comprar</p>

    <form #f="ngForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="correo" class="req">Correo electrónico</label>
        <input id="correo" type="email" [(ngModel)]="credentials.username" name="username"
               placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="clave" class="req">Contraseña</label>
        <app-campo-password inputId="clave" name="password" [(ngModel)]="credentials.password"
                            placeholder="Tu contraseña" autocomplete="current-password" required />
      </div>

      @if (errorMessage()) { <div class="alerta error">{{ errorMessage() }}</div> }
      @if (mensaje()) { <div class="alerta ok">{{ mensaje() }}</div> }

      <button type="submit" class="btn-submit" [disabled]="enviando() || f.invalid">
        {{ enviando() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
      <p class="leyenda">Los campos con <span class="asterisco">*</span> son obligatorios</p>
    </form>

    <p class="pie">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
  </div>
</div>
