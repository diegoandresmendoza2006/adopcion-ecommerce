<div class="register-container">
  <div class="register-card">
    <div class="logo"><ng-icon name="lucidePawPrint" size="46" /></div>
    <h2>Crea tu cuenta</h2>
    <p class="subtitulo">Únete a Paws&Shop para adoptar y comprar</p>

    <form #f="ngForm" (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="nombre" class="req">Nombre completo</label>
        <input id="nombre" type="text" [(ngModel)]="usuario.nombre_completo" name="nombre_completo"
               placeholder="Tu nombre y apellido" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="correo" class="req">Correo electrónico</label>
        <input id="correo" type="email" [(ngModel)]="usuario.email" name="email"
               placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="clave" class="req">Contraseña</label>
        <app-campo-password inputId="clave" name="password" [(ngModel)]="usuario.password"
                            placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6" />
      </div>

      @if (errorMessage()) { <div class="alerta error">{{ errorMessage() }}</div> }
      @if (mensaje()) { <div class="alerta ok">{{ mensaje() }}</div> }

      <button type="submit" class="btn-submit" [disabled]="enviando() || f.invalid">
        {{ enviando() ? 'Creando cuenta...' : 'Registrarse' }}
      </button>
      <p class="leyenda">Los campos con <span class="asterisco">*</span> son obligatorios</p>
    </form>

    <p class="pie">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
